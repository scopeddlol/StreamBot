services:
  streambot:
    build: .
    image: streambot-tv:local
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3000"
      XDG_CACHE_HOME: /data/cache
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=1G,mode=1777
    cap_drop:
      - ALL
    # Initialization, privilege drop and tini signal forwarding; Bun runs as UID 1000.
    cap_add:
      - CHOWN
      - KILL
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
