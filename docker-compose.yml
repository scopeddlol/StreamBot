services:
  streambot:
    build:
      context: .
      dockerfile: Dockerfile
    image: streambot-media:local
    restart: unless-stopped
    init: true
    env_file:
      - ${STREAMBOT_ENV_FILE:-.env}
    environment:
      VIDEOS_DIR: /home/bots/StreamBot/videos
      PREVIEW_CACHE_DIR: /home/bots/StreamBot/tmp/preview-cache
      MEDIA_SERVERS_CONFIG: /home/bots/StreamBot/config/media-servers.json
      SERVER_ENABLED: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
    volumes:
      - ./data/videos:/home/bots/StreamBot/videos
      - ./data/preview-cache:/home/bots/StreamBot/tmp/preview-cache
      - ./config:/home/bots/StreamBot/config:ro
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 30s
